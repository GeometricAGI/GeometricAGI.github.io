<path d="M 1230 360.0 L 1283 360" fill="none" stroke="#9caa94" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1320" y="247" font-size="20" fill="#202c25" font-weight="600" text-anchor="middle">row</text>
<text x="1320" y="367" font-size="20" fill="#202c25" font-weight="600" text-anchor="middle">col</text>
<path d="M 612 290 L 788 290" fill="none" stroke="#284b3a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#active)"/>
<text x="700" y="275" font-size="20" fill="#284b3a" font-weight="600" text-anchor="middle">rewrite</text>
<text x="700" y="322" font-size="15" fill="#626d64" font-weight="400" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">x // 8 = x &gt;&gt; 3</text>
<text x="700" y="346" font-size="15" fill="#626d64" font-weight="400" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">(x + c) % 8 = x &amp; 7</text>
<text x="700" y="370" font-size="15" fill="#626d64" font-weight="400" text-anchor="middle">when 8 divides c</text>
<text x="700" y="470" font-size="17" fill="#202c25" font-weight="500" text-anchor="middle">Lean checks that the optimized graph computes the same row and column as the traced graph, for every 32-bit i.</text>
<rect x="40" y="505" width="1320" height="270" rx="18" fill="#f7f8f3" stroke="#d8ddd0" stroke-width="1.5"/>
<text x="65" y="537" font-size="14" fill="#626d64" font-weight="600" text-anchor="start">LOWERING TO PTX</text>
