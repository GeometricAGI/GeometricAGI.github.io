<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="805" viewBox="0 0 1400 805" role="img" aria-labelledby="title desc">
<title id="title">Two graphs for the same result</title><desc id="desc">A Tessella kernel computes the row and column of element i + 64 of an eight-column matrix. The traced graph uses division and remainder by 8; a proved rewrite replaces them with a shift and a mask, and drops the addition from the column. Lowering maps each operation to PTX instructions, and an operation such as multiply-add can have several registered lowerings.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9caa94"/></marker><marker id="active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#284b3a"/></marker></defs>
<rect width="1400" height="805" fill="#f9faf5"/><g font-family="DejaVu Sans, sans-serif">
<text x="40" y="43" font-size="14" fill="#626d64" font-weight="600" text-anchor="start">GROWING LANGUAGES  /  02</text>
<text x="40" y="88" font-size="31" fill="#202c25" font-weight="600" text-anchor="start">Two graphs for the same result</text>
<text x="40" y="127" font-size="19" fill="#626d64" font-weight="400" text-anchor="start">A proved rewrite turns one computation graph into the other; a lowering then commits to PTX instructions.</text>
<rect x="40" y="165" width="560" height="270" rx="18" fill="#f7f8f3" stroke="#d8ddd0" stroke-width="1.5"/>
<text x="65" y="197" font-size="14" fill="#626d64" font-weight="600" text-anchor="start">TRACED GRAPH</text>
<rect x="65" y="215" width="90" height="50" rx="14" fill="#edf1e6" stroke="#bdcbb5" stroke-width="1.5"/>
<text x="110.0" y="247.56" font-size="21" fill="#284b3a" font-weight="600" text-anchor="middle">i</text>
<rect x="65" y="335" width="90" height="50" rx="14" fill="#edf1e6" stroke="#bdcbb5" stroke-width="1.5"/>
<text x="110.0" y="367.56" font-size="21" fill="#284b3a" font-weight="600" text-anchor="middle">64</text>
<rect x="200" y="275" width="100" height="50" rx="14" fill="#edf1e6" stroke="#bdcbb5" stroke-width="1.5"/>
<text x="250.0" y="307.56" font-size="21" fill="#284b3a" font-weight="600" text-anchor="middle">+</text>
<rect x="355" y="215" width="120" height="50" rx="14" fill="#edf1e6" stroke="#bdcbb5" stroke-width="1.5"/>
