<text x="415.0" y="367.56" font-size="21" fill="#284b3a" font-weight="600" text-anchor="middle">% 8</text>
<path d="M 155 240.0 L 188 300.0" fill="none" stroke="#9caa94" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 155 360.0 L 188 300.0" fill="none" stroke="#9caa94" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 300 300.0 L 343 240.0" fill="none" stroke="#9caa94" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 300 300.0 L 343 360.0" fill="none" stroke="#9caa94" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
