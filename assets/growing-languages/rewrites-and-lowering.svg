<text x="565" y="367" font-size="20" fill="#202c25" font-weight="600" text-anchor="middle">col</text>
<rect x="800" y="165" width="560" height="270" rx="18" fill="#f7f8f3" stroke="#d8ddd0" stroke-width="1.5"/>
<text x="825" y="197" font-size="14" fill="#626d64" font-weight="600" text-anchor="start">OPTIMIZED GRAPH</text>
<rect x="825" y="215" width="90" height="50" rx="14" fill="#edf1e6" stroke="#bdcbb5" stroke-width="1.5"/>
