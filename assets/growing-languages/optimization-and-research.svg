<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="890" viewBox="0 0 1400 890" role="img" aria-labelledby="title desc">
<title id="title">Attention search and language growth</title><desc id="desc">Optimization explores attention kernels on the warp-level and tensor-memory matrix paths, with choices of row reduction and of how exponentials are computed. A research phase can develop row-statistics types, ownership-aware lowerings, and improved investigation methods for future searches. All candidates must satisfy a numerical contract: an input domain, an error tolerance, and the treatment of exceptional values. Reordered reductions and approximate exponentials meet it without being exactly equivalent. An evaluation step measures the gain of each retained abstraction on later tasks before it returns to the search.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9caa94"/></marker><marker id="active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#284b3a"/></marker></defs>
